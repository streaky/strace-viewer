package = "strace-viewer"
artifact = "executable"
rust-toolchain = "pinned"

[profile]
name = "strace-viewer"
capabilities = ["filesystem", "process", "networking", "entropy", "build", "threads"]

[namespaces]
strace-viewer = "src"

[terrane-dependencies.streaky.strace-format]
path = "strace-format"

[terrane-dependencies.streaky.template]
path = "../../packages/template"

[terrane-dependencies.streaky.http-server]
path = "../../packages/http-server"

[rust-dependencies.regress]
version = "0.12.0"
effects = ["build"]

[consumers.template]
command = "../../packages/template/.trn/consumers/template"
args = ["--namespace", "generated/template/strace-viewer", "--root", "templates", "--template", "index.html"]
declarations = ["/strace-viewer::main"]

[consumers.http-server]
command = "../../packages/http-server/.trn/consumers/http-server"
declarations = [
    "/strace-viewer::viewer-site",
    "/strace-viewer::viewer-site::home",
    "/strace-viewer::viewer-site::home::key",
]

[testing]
unit = "tests/unit"

[testing.profile]
capabilities = ["filesystem", "process", "networking", "entropy", "build", "threads"]
